
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} — BookHub</title>
</head>
<body>
    <h1>{{ title }}</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.non_field_errors }}

        {% for field in form %}
            <div>
                <p>
                    <label for="{{ field.id_for_label }}">
                        {{ field.label }}
                    </label>
                </p>

                {{ field }}

                {% if field.help_text %}
                    <p>{{ field.help_text }}</p>
                {% endif %}

                {% for error in field.errors %}
                    <p style="color: red;">{{ error }}</p>
                {% endfor %}
            </div>
        {% endfor %}

        <button type="submit">Сохранить</button>
        <a href="{% url 'book_list' %}">Отмена</a>
    </form>
</body>
</html>
